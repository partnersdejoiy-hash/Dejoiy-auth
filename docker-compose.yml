name: dejoiy-auth

services:
  postgres:
    image: postgres:16-alpine
    container_name: dejoiy-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dejoiy_auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
      POSTGRES_DB: dejoiy_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5435 avoids clashing with any other local PostgreSQL
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dejoiy_auth -d dejoiy_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dejoiy-auth-net]

  redis:
    image: redis:7-alpine
    container_name: dejoiy-auth-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [dejoiy-auth-net]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dejoiy-auth-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://dejoiy_auth:${POSTGRES_PASSWORD:-change-me-strong-db-password}@postgres:5432/dejoiy_auth
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [dejoiy-auth-net]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: dejoiy-auth-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"
    networks: [dejoiy-auth-net]

volumes:
  pgdata:
  redisdata:

networks:
  dejoiy-auth-net:
    driver: bridge
