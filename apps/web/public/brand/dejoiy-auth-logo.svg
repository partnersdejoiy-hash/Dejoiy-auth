<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B00FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#001A4D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001A4D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(300, 100)">
    <!-- Outer rounded square border -->
    <rect x="0" y="0" width="300" height="300" rx="60" ry="60" fill="none" stroke="url(#logoGradient)" stroke-width="12"/>
    
    <!-- Inner rounded square with gradient fill -->
    <rect x="12" y="12" width="276" height="276" rx="50" ry="50" fill="url(#logoGradient)" opacity="0.1"/>
    
    <!-- D Letter -->
    <text x="80" y="200" font-size="180" font-weight="bold" fill="white" font-family="Arial, sans-serif">D</text>
    
    <!-- Smile/Joy curve -->
    <path d="M 160 140 Q 180 180 200 160" stroke="white" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Joy dot (eye) -->
    <circle cx="190" cy="130" r="8" fill="white"/>
  </g>
  
  <!-- DEJOIY Text -->
  <text x="600" y="320" font-size="140" font-weight="900" fill="#001A4D" font-family="Arial, sans-serif" letter-spacing="8">DEJOIY</text>
  
  <!-- O with gradient circle -->
  <circle cx="810" cy="280" r="45" fill="url(#logoGradient)" opacity="0.9"/>
  <text x="795" y="310" font-size="140" font-weight="900" fill="white" font-family="Arial, sans-serif">O</text>
  
  <!-- YOU+JOY tagline -->
  <text x="600" y="420" font-size="48" fill="#001A4D" font-family="Arial, sans-serif" letter-spacing="2">YOU+</text>
  <text x="820" y="420" font-size="48" fill="#FF1493" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="2">JOY</text>
</svg>