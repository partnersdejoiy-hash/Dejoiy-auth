<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="oGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon Background -->
  <rect x="50" y="50" width="200" height="200" rx="40" ry="40" fill="white"/>
  
  <!-- Icon Border -->
  <rect x="50" y="50" width="200" height="200" rx="40" ry="40" fill="none" stroke="url(#iconGradient)" stroke-width="8"/>
  
  <!-- D Letter inside icon -->
  <text x="150" y="160" font-size="120" font-weight="bold" fill="#E0E0E0" font-family="Arial, sans-serif" text-anchor="middle" opacity="0.5">D</text>
  
  <!-- DEJOIY Text -->
  <text x="300" y="140" font-size="100" font-weight="900" fill="#001A4D" font-family="Arial, sans-serif" letter-spacing="4">DE</text>
  
  <!-- O with gradient background -->
  <circle cx="550" cy="90" r="50" fill="url(#oGradient)"/>
  <text x="550" y="120" font-size="100" font-weight="900" fill="white" font-family="Arial, sans-serif" text-anchor="middle">O</text>
  
  <!-- IY Text -->
  <text x="630" y="140" font-size="100" font-weight="900" fill="#001A4D" font-family="Arial, sans-serif" letter-spacing="4">IY</text>
  
  <!-- YOU+JOY Tagline -->
  <text x="300" y="200" font-size="40" fill="#001A4D" font-family="Arial, sans-serif" letter-spacing="1">YOU+</text>
  <text x="500" y="200" font-size="40" fill="#E91E8C" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="1">JOY</text>
</svg>