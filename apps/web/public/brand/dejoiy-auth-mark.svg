<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="djGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2DAD"/>
      <stop offset="30%" stop-color="#B830FF"/>
      <stop offset="55%" stop-color="#6A5BFF"/>
      <stop offset="80%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="djBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D0C52"/>
      <stop offset="100%" stop-color="#0D0731"/>
    </linearGradient>
    <linearGradient id="djCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9CFFF"/>
    </linearGradient>
    <radialGradient id="djGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- identity core ring (subtle) -->
  <circle cx="128" cy="128" r="122" fill="none" stroke="url(#djGrad)" stroke-opacity="0.18" stroke-width="2"/>

  <!-- neon glow -->
  <circle cx="128" cy="132" r="96" fill="url(#djGlow)"/>

  <!-- envelope body -->
  <rect x="56" y="86" width="144" height="84" rx="22" fill="url(#djBody)" stroke="url(#djGrad)" stroke-width="3.5"/>
  <rect x="62" y="92" width="132" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- pocket lines -->
  <path d="M128 112 C 112 128, 92 144, 74 156" fill="none" stroke="url(#djGrad)" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
  <path d="M128 112 C 144 128, 164 144, 182 156" fill="none" stroke="url(#djGrad)" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>

  <!-- raised flap -->
  <path d="M64 92 C 78 76, 102 66, 128 66 C 154 66, 178 76, 192 92 L 192 100 C 178 86, 154 78, 128 78 C 102 78, 78 86, 64 100 Z" fill="url(#djGrad)"/>

  <!-- keyhole scan line -->
  <circle cx="128" cy="120" r="7" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path d="M128 127 L128 134" stroke="#00E5FF" stroke-width="2.4" stroke-linecap="round"/>
</svg>
